<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="1600" fill="#080812"/>

  <!-- Outer Swiss Margin Guide -->
  <rect x="80" y="80" width="1040" height="1440" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(100, 140)">
    <text class="font-mono" x="0" y="0" font-size="16" fill="#FFFFFF" opacity="0.5" letter-spacing="3">REF.ARCHIVE / POSTER SERIE</text>
    <text class="font-mono" x="1000" y="0" font-size="16" fill="#FF3366" text-anchor="end" font-weight="700" letter-spacing="2">NO. 001 / 070</text>
    <line x1="0" y1="24" x2="1000" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Group Badge & Subcategory -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="160" height="32" fill="#FF3366" rx="2"/>
    <text class="font-sans" x="80" y="21" font-size="13" font-weight="700" fill="#080812" text-anchor="middle" letter-spacing="1.5">TRENDING</text>
    <text class="font-mono" x="180" y="21" font-size="14" fill="#FFFFFF" opacity="0.6" letter-spacing="1">CURATION · 2026 REF-ARCHIVE</text>
  </g>

  <!-- Main Hero Graphic Container -->
  <g id="hero-graphic">
    
        <defs>
          <radialGradient id="hm1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF0055" stop-opacity="0.9"/>
            <stop offset="35%" stop-color="#FFCC00" stop-opacity="0.8"/>
            <stop offset="70%" stop-color="#00FF66" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="hm2" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="25%" stop-color="#FF3300" stop-opacity="0.8"/>
            <stop offset="60%" stop-color="#9900FF" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#000033" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="580" cy="700" r="380" fill="url(#hm1)"/>
        <circle cx="680" cy="620" r="280" fill="url(#hm2)"/>
        <path d="M 300 700 Q 600 450 900 700 T 500 950" fill="none" stroke="#FF3366" stroke-width="3" opacity="0.6"/>
        <circle cx="680" cy="620" r="8" fill="#FFFFFF"/>
        <text x="705" y="625" font-family="monospace" font-size="16" fill="#FFFFFF" letter-spacing="2">HOTSPOT 98.4°C</text>
      
  </g>

  <!-- Title & Typographic Composition -->
  <g transform="translate(100, 1180)">
    <text class="font-sans" x="0" y="70" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Heat Map</text>
    <text class="font-sans" x="0" y="125" font-size="28" font-weight="400" fill="#FF3366" opacity="0.95">서멀 그라디언트 & 열화상 비주얼</text>
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Editorial Analysis / Principle Block -->
  <g transform="translate(100, 1380)">
    <!-- Column 1: Anatomy -->
    <g transform="translate(0, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#FFFFFF" opacity="0.45" letter-spacing="2">01 / VISUAL ANATOMY</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#FFFFFF" opacity="0.85" width="460">
        적외선 온도 스펙트럼의 고대비 멀티컬러 그라디언트(블루-시안-그...
      </text>
    </g>

    <!-- Column 2: Principle -->
    <g transform="translate(520, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#FF3366" letter-spacing="2">02 / CORE PRINCIPLE</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#FFFFFF" opacity="0.85">
        과학 관측 장비의 열역학적 기능 데이터를 감각적 색채 추상으로 ...
      </text>
    </g>
  </g>

  <!-- Footer Technical Grid & Barcode -->
  <g transform="translate(100, 1490)">
    <text class="font-mono" x="0" y="0" font-size="12" fill="#FFFFFF" opacity="0.35" letter-spacing="3">DIMENSION: 1200 x 1600 · RATIO: 3:4 · ARCHIVE.SITE</text>
    
    <!-- Minimalist Barcode Lines -->
    <g transform="translate(860, -18)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <line x1="5" y1="0" x2="5" y2="24" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="18" y1="0" x2="18" y2="24" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
      <line x1="26" y1="0" x2="26" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="32" y1="0" x2="32" y2="24" stroke="#FFFFFF" stroke-width="5" opacity="0.5"/>
      <line x1="42" y1="0" x2="42" y2="24" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <line x1="48" y1="0" x2="48" y2="24" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
      <line x1="58" y1="0" x2="58" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="64" y1="0" x2="64" y2="24" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
      <line x1="72" y1="0" x2="72" y2="24" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <line x1="80" y1="0" x2="80" y2="24" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
      <line x1="90" y1="0" x2="90" y2="24" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="0" x2="100" y2="24" stroke="#FFFFFF" stroke-width="6" opacity="0.5"/>
      <line x1="112" y1="0" x2="112" y2="24" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <line x1="120" y1="0" x2="120" y2="24" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
      <line x1="130" y1="0" x2="130" y2="24" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <line x1="140" y1="0" x2="140" y2="24" stroke="#FFFFFF" stroke-width="5" opacity="0.5"/>
    </g>
  </g>
</svg>