<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="1600" fill="#F8FAFC"/>

  <!-- Outer Swiss Margin Guide -->
  <rect x="80" y="80" width="1040" height="1440" fill="none" stroke="#0F172A" stroke-width="1" opacity="0.15"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(100, 140)">
    <text class="font-mono" x="0" y="0" font-size="16" fill="#0F172A" opacity="0.5" letter-spacing="3">REF.ARCHIVE / POSTER SERIE</text>
    <text class="font-mono" x="1000" y="0" font-size="16" fill="#EC4899" text-anchor="end" font-weight="700" letter-spacing="2">NO. 053 / 070</text>
    <line x1="0" y1="24" x2="1000" y2="24" stroke="#0F172A" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Group Badge &amp; Subcategory -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="160" height="32" fill="#EC4899" rx="2"/>
    <text class="font-sans" x="80" y="21" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">DIGITAL &amp; 3D</text>
    <text class="font-mono" x="180" y="21" font-size="14" fill="#0F172A" opacity="0.6" letter-spacing="1">CURATION · 2026 REF-ARCHIVE</text>
  </g>

  <!-- Main Hero Graphic Container -->
  <g id="hero-graphic">
    
        <defs>
          <linearGradient id="defGrad_52" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
        <circle cx="600" cy="660" r="280" fill="url(#defGrad_52)" opacity="0.85"/>
        <rect x="360" y="440" width="480" height="440" fill="none" stroke="#0F172A" stroke-width="2" opacity="0.3"/>
        <line x1="280" y1="660" x2="920" y2="660" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
        <line x1="600" y1="340" x2="600" y2="980" stroke="#0F172A" stroke-width="1" opacity="0.4"/>
      
  </g>

  <!-- Title &amp; Typographic Composition -->
  <g transform="translate(100, 1180)">
    <text class="font-sans" x="0" y="70" font-size="82" font-weight="800" fill="#0F172A" letter-spacing="-1.5">Inflatable 3D</text>
    <text class="font-sans" x="0" y="125" font-size="28" font-weight="400" fill="#EC4899" opacity="0.95">풍선처럼 부풀어 오른 튜브 3D</text>
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#0F172A" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Editorial Analysis / Principle Block -->
  <g transform="translate(100, 1380)">
    <!-- Column 1: Anatomy -->
    <g transform="translate(0, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#0F172A" opacity="0.45" letter-spacing="2">01 / VISUAL ANATOMY</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#0F172A" opacity="0.85" width="460">
        공기가 빵빵하게 찬 고무 튜브, 비닐 풍선 질감과 둥글둥글한 볼...
      </text>
    </g>

    <!-- Column 2: Principle -->
    <g transform="translate(520, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#EC4899" letter-spacing="2">02 / CORE PRINCIPLE</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#0F172A" opacity="0.85">
        탄력과 공기압의 부드러운 촉각성을 시각화하여 친근하고 경쾌한 에...
      </text>
    </g>
  </g>

  <!-- Footer Technical Grid &amp; Barcode -->
  <g transform="translate(100, 1490)">
    <text class="font-mono" x="0" y="0" font-size="12" fill="#0F172A" opacity="0.35" letter-spacing="3">DIMENSION: 1200 x 1600 · RATIO: 3:4 · ARCHIVE.SITE</text>
    
    <!-- Minimalist Barcode Lines -->
    <g transform="translate(860, -18)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#0F172A" stroke-width="2" opacity="0.5"/>
      <line x1="5" y1="0" x2="5" y2="24" stroke="#0F172A" stroke-width="4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#0F172A" stroke-width="1" opacity="0.5"/>
      <line x1="18" y1="0" x2="18" y2="24" stroke="#0F172A" stroke-width="3" opacity="0.5"/>
      <line x1="26" y1="0" x2="26" y2="24" stroke="#0F172A" stroke-width="1" opacity="0.5"/>
      <line x1="32" y1="0" x2="32" y2="24" stroke="#0F172A" stroke-width="5" opacity="0.5"/>
      <line x1="42" y1="0" x2="42" y2="24" stroke="#0F172A" stroke-width="2" opacity="0.5"/>
      <line x1="48" y1="0" x2="48" y2="24" stroke="#0F172A" stroke-width="4" opacity="0.5"/>
      <line x1="58" y1="0" x2="58" y2="24" stroke="#0F172A" stroke-width="1" opacity="0.5"/>
      <line x1="64" y1="0" x2="64" y2="24" stroke="#0F172A" stroke-width="3" opacity="0.5"/>
      <line x1="72" y1="0" x2="72" y2="24" stroke="#0F172A" stroke-width="2" opacity="0.5"/>
      <line x1="80" y1="0" x2="80" y2="24" stroke="#0F172A" stroke-width="4" opacity="0.5"/>
      <line x1="90" y1="0" x2="90" y2="24" stroke="#0F172A" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="0" x2="100" y2="24" stroke="#0F172A" stroke-width="6" opacity="0.5"/>
      <line x1="112" y1="0" x2="112" y2="24" stroke="#0F172A" stroke-width="1" opacity="0.5"/>
      <line x1="120" y1="0" x2="120" y2="24" stroke="#0F172A" stroke-width="3" opacity="0.5"/>
      <line x1="130" y1="0" x2="130" y2="24" stroke="#0F172A" stroke-width="2" opacity="0.5"/>
      <line x1="140" y1="0" x2="140" y2="24" stroke="#0F172A" stroke-width="5" opacity="0.5"/>
    </g>
  </g>
</svg>