<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="1600" fill="#0F1210"/>

  <!-- Outer Swiss Margin Guide -->
  <rect x="80" y="80" width="1040" height="1440" fill="none" stroke="#F0FDF4" stroke-width="1" opacity="0.15"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(100, 140)">
    <text class="font-mono" x="0" y="0" font-size="16" fill="#F0FDF4" opacity="0.5" letter-spacing="3">REF.ARCHIVE / POSTER SERIE</text>
    <text class="font-mono" x="1000" y="0" font-size="16" fill="#4ADE80" text-anchor="end" font-weight="700" letter-spacing="2">NO. 002 / 070</text>
    <line x1="0" y1="24" x2="1000" y2="24" stroke="#F0FDF4" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Group Badge &amp; Subcategory -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="160" height="32" fill="#4ADE80" rx="2"/>
    <text class="font-sans" x="80" y="21" font-size="13" font-weight="700" fill="#0F1210" text-anchor="middle" letter-spacing="1.5">TRENDING</text>
    <text class="font-mono" x="180" y="21" font-size="14" fill="#F0FDF4" opacity="0.6" letter-spacing="1">CURATION · 2026 REF-ARCHIVE</text>
  </g>

  <!-- Main Hero Graphic Container -->
  <g id="hero-graphic">
    
        <defs>
          <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ADE80"/>
            <stop offset="100%" stop-color="#22C55E"/>
          </linearGradient>
        </defs>
        <path d="M 600 350 C 850 350, 950 500, 900 750 C 850 1000, 700 1050, 500 1000 C 300 950, 250 800, 320 600 C 380 420, 450 350, 600 350 Z" fill="url(#bioGrad)" opacity="0.85"/>
        <path d="M 600 450 C 780 450, 840 550, 800 720 C 760 880, 650 920, 520 880 C 380 840, 360 720, 410 590 C 450 480, 500 450, 600 450 Z" fill="#0F1210" opacity="0.95"/>
        <circle cx="600" cy="680" r="100" fill="#4ADE80" opacity="0.7"/>
      
  </g>

  <!-- Title &amp; Typographic Composition -->
  <g transform="translate(100, 1180)">
    <text class="font-sans" x="0" y="70" font-size="82" font-weight="800" fill="#F0FDF4" letter-spacing="-1.5">Biomorphism</text>
    <text class="font-sans" x="0" y="125" font-size="28" font-weight="400" fill="#4ADE80" opacity="0.95">유기적 곡선 &amp; 생체 형태학</text>
    <line x1="0" y1="160" x2="1000" y2="160" stroke="#F0FDF4" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Editorial Analysis / Principle Block -->
  <g transform="translate(100, 1380)">
    <!-- Column 1: Anatomy -->
    <g transform="translate(0, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#F0FDF4" opacity="0.45" letter-spacing="2">01 / VISUAL ANATOMY</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#F0FDF4" opacity="0.85" width="460">
        세포막, 미생물, 자연물의 유기적인 굴곡을 모티프로 한 곡선형 ...
      </text>
    </g>

    <!-- Column 2: Principle -->
    <g transform="translate(520, 0)">
      <text class="font-mono" x="0" y="0" font-size="13" fill="#4ADE80" letter-spacing="2">02 / CORE PRINCIPLE</text>
      <text class="font-sans" x="0" y="28" font-size="16" fill="#F0FDF4" opacity="0.85">
        직선적 인공 구조를 탈피하고 생명체의 유연한 호흡과 볼륨감을 평...
      </text>
    </g>
  </g>

  <!-- Footer Technical Grid &amp; Barcode -->
  <g transform="translate(100, 1490)">
    <text class="font-mono" x="0" y="0" font-size="12" fill="#F0FDF4" opacity="0.35" letter-spacing="3">DIMENSION: 1200 x 1600 · RATIO: 3:4 · ARCHIVE.SITE</text>
    
    <!-- Minimalist Barcode Lines -->
    <g transform="translate(860, -18)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#F0FDF4" stroke-width="2" opacity="0.5"/>
      <line x1="5" y1="0" x2="5" y2="24" stroke="#F0FDF4" stroke-width="4" opacity="0.5"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#F0FDF4" stroke-width="1" opacity="0.5"/>
      <line x1="18" y1="0" x2="18" y2="24" stroke="#F0FDF4" stroke-width="3" opacity="0.5"/>
      <line x1="26" y1="0" x2="26" y2="24" stroke="#F0FDF4" stroke-width="1" opacity="0.5"/>
      <line x1="32" y1="0" x2="32" y2="24" stroke="#F0FDF4" stroke-width="5" opacity="0.5"/>
      <line x1="42" y1="0" x2="42" y2="24" stroke="#F0FDF4" stroke-width="2" opacity="0.5"/>
      <line x1="48" y1="0" x2="48" y2="24" stroke="#F0FDF4" stroke-width="4" opacity="0.5"/>
      <line x1="58" y1="0" x2="58" y2="24" stroke="#F0FDF4" stroke-width="1" opacity="0.5"/>
      <line x1="64" y1="0" x2="64" y2="24" stroke="#F0FDF4" stroke-width="3" opacity="0.5"/>
      <line x1="72" y1="0" x2="72" y2="24" stroke="#F0FDF4" stroke-width="2" opacity="0.5"/>
      <line x1="80" y1="0" x2="80" y2="24" stroke="#F0FDF4" stroke-width="4" opacity="0.5"/>
      <line x1="90" y1="0" x2="90" y2="24" stroke="#F0FDF4" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="0" x2="100" y2="24" stroke="#F0FDF4" stroke-width="6" opacity="0.5"/>
      <line x1="112" y1="0" x2="112" y2="24" stroke="#F0FDF4" stroke-width="1" opacity="0.5"/>
      <line x1="120" y1="0" x2="120" y2="24" stroke="#F0FDF4" stroke-width="3" opacity="0.5"/>
      <line x1="130" y1="0" x2="130" y2="24" stroke="#F0FDF4" stroke-width="2" opacity="0.5"/>
      <line x1="140" y1="0" x2="140" y2="24" stroke="#F0FDF4" stroke-width="5" opacity="0.5"/>
    </g>
  </g>
</svg>